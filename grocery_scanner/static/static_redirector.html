<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript">
      const mainInventory = {{!item_json}};
      function tryRedirect() {
        const url = new URL(window.location);
        const key = url.searchParams.get("id");
        const loc = mainInventory[key];
        if (loc) {
          window.location.replace(loc);
        }
      }
      tryRedirect();
    </script>
</head>
<body>
    <div>
        If you are reading this, either:
    </div>
    <ul>
      <li>You have have Javascript disabled.</li>
      <li>None of the keys in the inventory match the id in the URL.</li>
      <li>You're here intentionally.</li>
    </ul>
    <div>
      You can find links to your items below.
    </div>
    <table>
        <tr>
            <th>Item</th>
            <th>Extra info</th>
        </tr>
        % for item_ref, item_name, shop_url in items:
            <tr>
                <td>
                  <a id="{{item_ref}}" href="{{shop_url}}">{{item_name}}</a>
                </td>
                <td>
                    N/A
                </td>
            </tr>
        % end
    </table>
</body>
</html>
